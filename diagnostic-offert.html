<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Diagnostic parcours client offert en 2 minutes | AM 2.0</title>
    <meta name="description" content="En seulement 2 minutes, découvrez ce qui freine aujourd'hui l'acquisition de vos futurs clients et repartez avec des pistes d'amélioration concrètes.">
    <link rel="canonical" href="https://www.am20.fr/diagnostic-offert">
    <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
    <link rel="icon" href="images/favicon/favicon16.png" sizes="16x16"/>
    <link rel="icon" href="images/favicon/favicon32.png" sizes="32x32"/>
    <link rel="icon" href="images/favicon/android192.png" sizes="192x192"/>
    <link rel="icon" href="images/favicon/android512.png" sizes="512x512"/>    
    <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png"/>
    <meta property="og:title" content="Où tes clients disparaissent ? Fais ton diagnostic parcours client gratuit">
    <meta property="og:description" content="En 2 minutes, identifie le maillon qui bloque tes prospects entre le premier clic et la prise de contact. Reçois tes points forts, tes axes d'amélioration et 3 actions concrètes.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.am20.fr/diagnostic-offert">
    <meta property="og:image" content="https://www.am20.fr/images/og-img2.jpg">
    <link rel="stylesheet" href="dist/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 text-slate-800 bg-white bg-[linear-gradient(to_bottom,rgba(255,255,255,0.85),rgba(41,198,220,0.92)),linear-gradient(to_right,rgba(226,232,240,0.8)_1px,transparent_1px),linear-gradient(to_bottom,rgba(226,232,240,0.8)_1px,transparent_1px)] bg-[length:100%_100%,38px_38px,38px_38px] bg-fixed font-sans antialiased pb-8 sm:pb-6">
    <header class="max-w-6xl w-full mx-auto flex justify-between items-center py-2 sm:py-4 px-2">
        <div class="flex items-center gap-3">
            <img src="images/logo/logo-am20.webp" alt="Logo AM 2.0" class="h-8 sm:h-10 w-auto object-contain" />
            <h1 class="uppercase text-xl sm:text-2xl tracking-tight bg-gradient-to-r from-purple-700 to-cyan-600 bg-clip-text text-transparent">
                Ton auto-diag
            </h1>
        </div>
    </header>
    <form name="diagnostic-presence" netlify netlify-honeypot="bot-field" class="hidden">
        <input type="hidden" name="form-name" value="diagnostic-presence" />
        <p class="hidden">
            <label>Ne pas remplir ce champ si vous êtes humain : <input name="bot-field" /></label>
        </p>
        <input type="text" name="prenom" />
        <input type="email" name="email" />
        <input type="text" name="statut" />
        <input type="text" name="accepte_newsletter" />
        <input type="text" name="score_message" />
        <input type="text" name="score_parcours" />
        <input type="text" name="score_conversion" />
        <input type="text" name="niveau" />
        <input type="text" name="frein_principal" />
        <textarea name="reponses_details"></textarea>
    </form>
    <main class="max-w-6xl w-full mx-auto py-2 sm:py-6 mb-4 sm:mb-0">
        <div class="sm:hidden mb-3 bg-white/80 p-3.5 rounded-2xl border border-slate-200/80 shadow-sm">
            <div class="flex justify-between items-center text-sm font-semibold text-slate-700 mb-1.5">
                <span id="mobile-step-label">Présentation</span>
                <span id="mobile-progress-percentage">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="mobile-progress-bar" class="bg-gradient-to-r from-purple-700 to-[#29c6dc] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">      
            <div class="lg:col-span-8 bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-2xl rounded-3xl p-5 sm:p-8 relative overflow-hidden flex flex-col justify-between h-[75dvh] max-h-[640px] sm:h-[640px] mb-2 sm:mb-0">         
                <div class="flex-none">
                    <div class="inline-block border border-cyan-200 bg-white/80 backdrop-blur-sm px-4 py-2 mb-8 rounded-full shadow-sm text-sm font-semibold text-cyan-700" id="card-badge">
                        Diagnostic Gratuit
                    </div>
                    <h2 id="card-title" class="text-xl sm:text-2xl"></h2>
                    <p id="card-subtitle" class="text-slate-600 text-base mb-3 sm:mb-4 font-medium">
                    </p>
                </div>
                <div class="flex-1 relative overflow-hidden flex flex-col my-1">
                    <div id="card-content" class="flex-1 overflow-y-auto pr-1 space-y-3 pb-6">
                    </div>
                    <div id="mobile-scroll-hint" class="sm:hidden pointer-events-none absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white/95 via-white/70 to-transparent flex items-end justify-center pb-1">
                        <span class="text-sm font-medium text-purple-700 bg-white/80 px-2 py-0.5 rounded-full backdrop-blur-sm border border-purple-700/50 shadow-xs flex items-center gap-1">
                            Faites défiler vers le bas ↓
                        </span>
                    </div>
                </div>
                <div class="flex-none flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 pt-4 border-t border-slate-100 mt-2" id="card-footer">
                    <button id="btn-back" class="hidden px-4 sm:px-5 py-2.5 sm:py-3 rounded-full border border-slate-300 text-slate-700 font-semibold text-sm sm:text-base hover:bg-slate-50 transition-all text-center whitespace-nowrap">
                        ← Précédent
                    </button>
                    <button id="btn-next" class="w-full sm:w-auto ml-auto inline-flex items-center justify-center gap-2 px-6 sm:px-8 py-3 rounded-full bg-gradient-to-r from-purple-700 to-[#29c6dc] text-white font-bold text-base shadow-md transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none enabled:hover:scale-105 enabled:active:scale-95 text-center">
                        Commencer
                    </button>
                </div>
            </div>
            <div class="hidden sm:flex lg:col-span-4 flex-col items-center justify-center p-6 bg-white/60 backdrop-blur-sm border border-slate-200/60 rounded-3xl shadow-xl h-[640px]">
                <div id="step-indicator-desktop" class="text-sm font-bold text-slate-600 uppercase tracking-wider hidden sm:block">
                    Présentation
                </div>
                <div class="relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-slate-200" fill="transparent" />
                        <circle id="progress-circle" cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="8" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" class="transition-all duration-500 ease-out" fill="transparent" />
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7e22ce" />
                                <stop offset="100%" stop-color="#29c6dc" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                        <span id="progress-percentage" class="text-3xl font-black text-slate-800">0%</span>
                        <span id="progress-label" class="text-xs font-semibold text-slate-500 uppercase tracking-wide mt-1">Progression</span>
                    </div>
                </div>
                <div id="side-info-box" class="mt-6 text-center space-y-1">
                    <p class="text-sm text-slate-600 font-medium">Ton diagnostic se construit au fil de tes réponses.</p>
                    <p class="text-sm font-semibold text-purple-700">Encore quelques clics pour découvrir tes premiers axes d'amélioration.</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="max-w-6xl w-full mx-auto pt-4 text-center text-sm text-slate-600 border-t border-slate-200/60 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div class="flex items-center gap-2">
            <a href="index.html" class="transition-transform duration-300 hover:scale-105 inline-flex items-center">
                <img src="images/logo/logo-am20.webp" alt="Logo AM 2.0" class="h-5 w-auto" width="20" height="20">
            </a>
            <p>© <span id="current-year">2026</span> AM 2.0 • Tous droits réservés</p>
        </div>
        <div class="flex gap-4">
            <a href="mentions-legales.html" class="hover:text-slate-900 transition-colors">Mentions & RGPD</a>
            <span>|</span>
            <a href="cgv.html" class="hover:text-slate-900 transition-colors">CGV</a>
        </div>
    </footer>
    <script src="dist/form.min.js" defer></script>
</body>
</html>
